name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 52d203d041f9e4baad4a78013abeccd8f13a86e3
          path: host
      - run: python -m pip install -e './host' '.[dev]'
      - run: python -m mypy
      - run: python -m black --check --target-version py311 src tests
      # PYTHONPATH deliberately omits `host`. This workflow checks the Hermes
      # Agent checkout out into `host/`, and putting that directory on the path
      # shadows this repository's own `tests` package with `host/tests`, so
      # `from tests.conftest import ...` resolves against Hermes instead of here
      # and the credential tests fail to collect. `pip install -e './host'` above
      # already puts hermes_yaml on the path, which is all the suite needs from it.
      - run: python -m pytest tests -q --cov=jev_lcm_hermes_compaction --cov-report=term-missing --cov-fail-under=90
      - run: python -m build
